name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prettier check (markdown)
        run: npx prettier@latest --check '**/*.md'

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6

      - name: Install koja
        uses: koja-lang/setup-koja@v1
        with:
          koja-version-file: koja.toml

      - name: Koja format check
        run: git ls-files '*.koja' | xargs koja format --check

      - name: Get dependencies
        run: koja deps get

      - name: Start Postgres
        run: |
          docker compose up -d postgresql
          for _ in $(seq 30); do
            docker compose exec -T postgresql pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "Postgres never became ready" >&2
          docker compose logs postgresql >&2
          exit 1

      - name: Run tests
        run: koja test

      - name: Run vendored library tests
        run: |
          for lib in lib/*/; do
            echo "== $lib"
            (cd "$lib" && koja test)
          done

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max